[project]
name = "seismic-prestack-backend"
version = "0.1.0"
description = "FastAPI backend and ML orchestrator for pre-stack seismic foundation model exploration"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "seismic-zfp>=0.5.1",
    "segyio>=1.9.15",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.67",
    "ncs @ git+https://github.com/NorskRegnesentral/NCS_models.git",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]

